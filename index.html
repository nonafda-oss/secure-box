<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeVault - กระเป๋าเก็บข้อมูลลับ</title>
  <!-- เปลี่ยนมาใช้ตัวโหลดสไตล์ที่เสถียรที่สุดบน GitHub Pages หน้าตาไม่พังแน่นอน -->
  <script src="https://jsdelivr.net"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    /* ล็อกความสูงกล่องข้อความความลับให้เลื่อนนิ้วขึ้นลงได้หากเนื้อหายาวมาก */
    .secret-scroll-box {
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body class="bg-gray-100 text-slate-800 min-h-screen pb-12">

  <!-- แถบเมนูด้านบน -->
  <nav class="bg-blue-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-semibold flex items-center gap-2">
        <span>🔒</span> SafeVault รหัสลับส่วนตัว
      </h1>
      <span id="totalItems" class="bg-blue-700 text-xs px-2.5 py-1 rounded-full font-medium">0 รายการ</span>
    </div>
  </nav>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- ฟอร์มกรอกข้อมูลการ์ด -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <h2 id="formHeader" class="text-sm font-semibold text-blue-600 mb-3">➕ เพิ่มบัตร หรือ รหัสลับใหม่</h2>
      <form id="vaultForm" class="space-y-3" autocomplete="off">
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">ชื่อรายการ / ชื่อบัญชี / บัตร</label>
          <input type="text" id="vName" required placeholder="เช่น บัตรประชาชน, รหัส ATM, Netflix" 
            class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">หมวดหมู่</label>
            <select id="vCategory" class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="🪪 บัตรราชการ">🪪 บัตรราชการ</option>
              <option value="💳 การเงิน">💳 การเงิน</option>
              <option value="🏥 สุขภาพ">🏥 สุขภาพ</option>
              <option value="🔑 รหัสผ่าน">🔑 รหัสผ่าน</option>
              <option value="🏷️ อื่นๆ">🏷️ อื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">วันหมดอายุ (ถ้ามี)</label>
            <input type="date" id="vExpireDate" class="w-full px-3 py-1.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-gray-500 mb-1">รายละเอียดข้อความ / บันทึกข้อมูลลับ</label>
          <textarea id="vSecretText" rows="3" required placeholder="ใส่รหัสผ่าน หรือโน้ตลับที่นี่..." 
            class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"></textarea>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" id="btnCancelEdit" class="hidden flex-1 py-2 text-sm font-medium bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl transition">
            ยกเลิก
          </button>
          <button type="submit" id="btnSubmitForm" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium transition">
            บันทึกข้อมูล
          </button>
        </div>
      </form>
    </section>

    <!-- ตัวค้นหาและกรองหมวดหมู่ -->
    <section class="flex gap-2">
      <input type="text" id="searchBar" placeholder="🔍 ค้นหาชื่อรายการ..." 
        class="flex-1 px-3 py-2 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
      <select id="categoryFilter" class="px-2.5 py-2 border border-gray-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="all">📁 ทุกหมวด</option>
        <option value="🪪 บัตรราชการ">🪪 บัตรราชการ</option>
        <option value="💳 การเงิน">💳 การเงิน</option>
        <option value="🏥 สุขภาพ">🏥 สุขภาพ</option>
        <option value="🔑 รหัสผ่าน">🔑 รหัสผ่าน</option>
        <option value="🏷️ อื่นๆ">🏷️ อื่นๆ</option>
      </select>
    </section>

    <!-- แหล่งรวมการ์ดแสดงผลข้อมูล -->
    <section id="vaultContainer" class="space-y-2"></section>

  </main>

  <!-- หน้าต่างแสดงรายละเอียด (Modal) แบบปรับสไตล์ใหม่ บรรทัดแรกไม่โดนบัง และกดเลื่อนดูข้อความยาวๆ ได้แน่นอน -->
  <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl relative">
      
      <!-- ส่วนหัวข้อ: หมวดหมู่และวันหมดอายุ (ชัดเจน ไม่มีสิ่งใดซ้อนทับ) -->
      <div class="border-b border-gray-100 pb-2">
        <div class="flex justify-between items-center gap-2 mb-1.5">
          <span id="displayBadge" class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md"></span>
          <span id="displayExpire" class="text-xs font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md hidden"></span>
        </div>
        <h3 id="displayName" class="font-bold text-gray-800 text-lg break-all"></h3>
      </div>
      
      <!-- ส่วนแสดงข้อมูลลับที่พิมพ์เยอะๆ: มีขอบเขตจำกัดความสูงและรูดเลื่อนอ่านได้เต็มที่ -->
      <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-200">
        <span class="text-[11px] font-bold text-blue-600 block mb-1">🔑 ข้อมูลลับ / บันทึก:</span>
        <div id="displaySecret" class="text-sm text-gray-700 secret-scroll-box select-all"></div>
      </div>
      
      <!-- แถบรวมปุ่มกดจัดการด้านล่างสุด แยกสัดส่วนปุ่มชัดเจน มีปุ่มลบแน่นอน -->
      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium transition">
          ปิด
        </button>
        <button id="btnActionEdit" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-4 py-2 rounded-xl text-sm font-medium transition">
          ✏️ แก้ไข
        </button>
        <button id="btnActionDelete" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-sm font-medium transition">
          🗑️ ลบ
        </button>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY = 'v4_stable_vault_data';
    let dataItems = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const vaultForm = document.getElementById('vaultForm');
    const vaultContainer = document.getElementById('vaultContainer');
    const totalItems = document.getElementById('totalItems');
    const searchBar = document.getElementById('searchBar');
    const categoryFilter = document.getElementById('categoryFilter');
    const detailModal = document.getElementById('detailModal');
    
    let editingIndex = null;

    function drawList() {
      const searchWord = searchBar.value.toLowerCase();
      const chosenFilter = categoryFilter.value;

      const processedList = dataItems.map((item, index) => ({ ...item, index })).filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchWord) || (item.secretText && item.secretText.toLowerCase().includes(searchWord));
        const matchesType = chosenFilter === 'all' || item.category === chosenFilter;
        return matchesSearch && matchesType;
      });

      totalItems.innerText = `${dataItems.length} รายการ`;
      vaultContainer.innerHTML = '';

      if (processedList.length === 0) {
        vaultContainer.innerHTML = `
          <div class="text-center text-gray-400 py-8 bg-white rounded-2xl border border-dashed border-gray-200">
            <p class="text-sm">ไม่พบข้อมูล</p>
          </div>`;
        return;
      }

      processedList.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-white px-4 py-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center hover:border-blue-300 transition cursor-pointer";
        div.innerHTML = `
          <div class="flex-1 min-w-0 pr-2" onclick="openModal(${item.index})">
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-[11px] text-gray-500">${item.category}</span>
            </div>
            <h3 class="font-medium text-gray-800 text-sm truncate">${item.name}</h3>
          </div>
          <button onclick="openModal(${item.index})" class="text-xs text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition shrink-0">
            🔑 ดูข้อมูล
          </button>
        `;
        vaultContainer.appendChild(div);
      });
    }

    function openModal(index) {
      const currentItem = dataItems[index];

      document.getElementById('displayBadge').innerText = currentItem.category;
      document.getElementById('displayName').innerText = currentItem.name;
      document.getElementById('displaySecret').innerText = currentItem.secretText || '(ไม่มีข้อมูลลับ)';

      const expLabel = document.getElementById('displayExpire');
      if (currentItem.expireDate) {
        expLabel.innerText = `⏳ หมดอายุ: ${currentItem.expireDate}`;
        expLabel.classList.remove('hidden');
      } else {
        expLabel.classList.add('hidden');
      }

      document.getElementById('btnActionDelete').onclick = () => removeEntry(index);
      document.getElementById('btnActionEdit').onclick = () => editEntry(index);

      detailModal.classList.remove('hidden');
    }

    function closeModal() {
      detailModal.classList.add('hidden');
    }

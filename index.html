<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SafeVault V3 - ระบบจัดเก็บข้อมูลลับใหม่ล่าสุด</title>
  <!-- ดึงระบบ Tailwind CSS -->
  <script src="https://jsdelivr.net"></script>
  <!-- ดึงระบบฟอนต์ Prompt -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
    .sheet-open { transform: translateY(0); }
    .sheet-close { transform: translateY(100%); }
  </style>
</head>
<body class="bg-zinc-100 text-zinc-900 min-h-screen antialiased">

  <!-- ส่วนหัวบนสุด -->
  <nav class="bg-blue-700 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛡️</span>
        <span class="font-semibold text-lg tracking-wide">SafeVault V3</span>
      </div>
      <span id="totalItems" class="bg-blue-800 text-xs font-medium px-3 py-1 rounded-full border border-blue-500/30">
        0 รายการ
      </span>
    </div>
  </nav>

  <!-- เนื้อหาภายในเว็บ -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- กล่องลงข้อมูลใหม่/แก้ไขข้อมูล -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-zinc-200/60">
      <h2 id="formHeader" class="text-sm font-semibold text-blue-700 mb-3 flex items-center gap-1.5">
        <span>📝 บันทึกข้อมูลลับชิ้นใหม่</span>
      </h2>
      
      <form id="vaultForm" class="space-y-3" autocomplete="off">
        <div>
          <label class="block text-[11px] font-medium text-zinc-500 mb-1">ชื่อบัญชี / ชื่อบัตร / หัวข้อ</label>
          <input type="text" id="vName" required placeholder="เช่น Netflix, บัตรประชาชน, รหัสเอทีเอ็ม" 
            class="w-full px-3 py-2 text-sm border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 bg-zinc-50/50">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-medium text-zinc-500 mb-1">หมวดหมู่</label>
            <select id="vCategory" class="w-full px-3 py-2 text-sm border border-zinc-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
              <option value="🔐 รหัสผ่าน">🔑 รหัสผ่าน / บัญชี</option>
              <option value="🪪 เอกสารสำคัญ">🪪 บัตร / เอกสาร</option>
              <option value="💳 การเงิน">💳 การเงิน / การ์ด</option>
              <option value="🏥 สุขภาพ">🏥 ประกัน / สุขภาพ</option>
              <option value="📌 บันทึกทั่วไป">📌 โน้ตลับอื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-medium text-zinc-500 mb-1">วันหมดอายุ (ถ้ามี)</label>
            <input type="date" id="vExpireDate" class="w-full px-3 py-1.5 text-sm border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-medium text-zinc-500 mb-1">รายละเอียด / รหัสผ่าน / ข้อความลับ</label>
          <textarea id="vSecretText" rows="3" required placeholder="พิมพ์ข้อความสำคัญ หรือรายละเอียดรหัสผ่านที่นี่..." 
            class="w-full px-3 py-2 text-sm border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 bg-zinc-50/50"></textarea>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" id="btnCancelEdit" class="hidden flex-1 py-2 text-sm font-medium bg-zinc-100 hover:bg-zinc-200 text-zinc-700 rounded-xl transition cursor-pointer">
            ยกเลิก
          </button>
          <button type="submit" id="btnSubmitForm" class="flex-2 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition shadow-sm cursor-pointer">
            บันทึกข้อมูล
          </button>
        </div>
      </form>
    </section>

    <!-- ช่องค้นหาข้อมูล -->
    <section class="flex gap-2">
      <input type="text" id="searchBar" placeholder="🔍 ค้นหาตามชื่อหัวข้อ..." 
        class="flex-1 px-3 py-2 text-sm bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
      <select id="categoryFilter" class="px-2.5 py-2 text-sm bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600">
        <option value="all">📂 ทั้งหมด</option>
        <option value="🔐 รหัสผ่าน">🔑 รหัสผ่าน</option>
        <option value="🪪 เอกสารสำคัญ">🪪 เอกสาร</option>
        <option value="💳 การเงิน">💳 การเงิน</option>
        <option value="🏥 สุขภาพ">🏥 สุขภาพ</option>
        <option value="📌 บันทึกทั่วไป">📌 โน้ตลับ</option>
      </select>
    </section>

    <!-- รายการบัตรที่บันทึกไว้ -->
    <section id="vaultContainer" class="space-y-2"></section>

  </main>

  <!-- หน้าต่างรายละเอียดเลื่อนจากข้างล่าง (BottomSheet) แก้ปัญหาข้อมูลล้นอ่านได้ครบถ้วน -->
  <div id="backdropOverlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity duration-300 opacity-0"></div>
  
  <div id="bottomSheet" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-3xl z-50 transition-transform duration-300 translate-y-full shadow-2xl flex flex-col max-h-[80vh]">
    <div class="w-12 h-1.5 bg-zinc-300 rounded-full mx-auto my-3 shrink-0"></div>

    <!-- ส่วนหัวหน้าต่าง ไม่โดนบังชัวร์ๆ -->
    <div class="px-5 pb-3 border-b border-zinc-100 shrink-0">
      <div class="flex items-center gap-2 mb-1.5">
        <span id="displayBadge" class="text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md"></span>
        <span id="displayExpire" class="text-[10px] font-semibold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md hidden"></span>
      </div>
      <h3 id="displayName" class="text-base font-bold text-zinc-800 break-words leading-tight"></h3>
    </div>

    <!-- บล็อกแสดงเนื้อหารหัสผ่านที่มีเนื้อหาเยอะๆ (ใช้นิ้วเลื่อนถูขึ้นลงได้อิสระ) -->
    <div class="p-5 overflow-y-auto flex-1 bg-zinc-50/50 space-y-2">
      <label class="block text-[11px] font-bold text-zinc-400 tracking-wide uppercase">🔑 ข้อมูลลับที่บันทึกไว้:</label>
      <div class="bg-white p-4 rounded-xl border border-zinc-200 shadow-inner">
        <p id="displaySecret" class="text-sm text-zinc-700 whitespace-pre-wrap break-words select-all leading-relaxed"></p>
      </div>
    </div>

    <!-- ล็อกแถบปุ่มกดด้านล่างให้เห็นชัดเจน มีปุ่มลบชัวร์ๆ -->
    <div class="p-4 bg-white border-t border-zinc-100 grid grid-cols-3 gap-2 shrink-0">
      <button onclick="closeSheet()" class="bg-zinc-100 hover:bg-zinc-200 text-zinc-700 py-3 rounded-xl text-sm font-medium transition cursor-pointer text-center">
        ปิดหน้าต่าง
      </button>
      <button id="btnActionEdit" class="bg-amber-50 hover:bg-amber-100 text-amber-700 py-3 rounded-xl text-sm font-medium transition cursor-pointer text-center">
        ✏️ แก้ไขข้อมูล
      </button>
      <button id="btnActionDelete" class="bg-rose-50 hover:bg-rose-100 text-rose-600 py-3 rounded-xl text-sm font-medium transition cursor-pointer text-center">
        🗑️ ลบรายการ
      </button>
    </div>
  </div>

  <script>
    // ใช้คีย์จัดเก็บใหม่ป้องกันข้อมูลจากหน้าเว็บเดิมมาซ้อนทับกัน
    const STORAGE_KEY = 'v3_final_secure_vault_data';
    let dataItems = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const vaultForm = document.getElementById('vaultForm');
    const vaultContainer = document.getElementById('vaultContainer');
    const totalItems = document.getElementById('totalItems');
    const searchBar = document.getElementById('searchBar');
    const categoryFilter = document.getElementById('categoryFilter');
    const backdropOverlay = document.getElementById('backdropOverlay');
    const bottomSheet = document.getElementById('bottomSheet');
    
    let activeIndex = null;
    let editingIndex = null;

    function drawList() {
      const searchWord = searchBar.value.toLowerCase();
      const chosenFilter = categoryFilter.value;

      const processedList = dataItems.map((item, index) => ({ ...item, index })).filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(searchWord) || (item.secretText && item.secretText.toLowerCase().includes(searchWord));
        const matchesType = chosenFilter === 'all' || item.category === chosenFilter;
        return matchesSearch && matchesType;
      });

      totalItems.innerText = `${dataItems.length} รายการ`;
      vaultContainer.innerHTML = '';

      if (processedList.length === 0) {
        vaultContainer.innerHTML = `
          <div class="text-center text-zinc-400 py-10 bg-white rounded-2xl border border-dashed border-zinc-200">
            <p class="text-sm">ไม่มีข้อมูลที่ตรงเงื่อนไข</p>
          </div>`;
        return;
      }

      processedList.forEach(item => {
        const div = document.createElement('div');
        div.className = "bg-white p-3.5 rounded-xl border border-zinc-200/80 shadow-xs flex justify-between items-center transition cursor-pointer";
        div.innerHTML = `
          <div class="flex-1 min-w-0 pr-3" onclick="openSheet(${item.index})">
            <div class="flex items-center gap-2 mb-0.5">
              <span class="text-[11px] shrink-0 bg-zinc-100 text-zinc-600 px-1.5 py-0.5 rounded">${item.category}</span>
            </div>
            <h3 class="font-medium text-zinc-800 text-sm truncate">${item.name}</h3>
          </div>
          <button onclick="openSheet(${item.index})" class="text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-lg transition shrink-0">
            👁️ เปิดดู
          </button>
        `;
        vaultContainer.appendChild(div);
      });
    }

    function openSheet(index) {
      activeIndex = index;
      const currentItem = dataItems[index];
